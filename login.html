<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ART | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url("imagens/tinta.jpeg") center / cover no-repeat fixed;
      padding: 24px 20px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.18);
      backdrop-filter: blur(2px);
      z-index: 0;
    }

    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .titulo {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: .04em;
      text-shadow: 0 2px 12px rgba(255,255,255,.6);
    }

    .card {
      width: 100%;
      background: rgba(255,255,255,.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 24px;
      border: 1.5px solid rgba(255,255,255,.75);
      box-shadow: 0 8px 32px rgba(0,0,0,.10);
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .avatar-placeholder {
      width: 68px; height: 68px;
      border-radius: 50%;
      background: rgba(200,200,200,.55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      border: 2px solid rgba(255,255,255,.8);
    }

    .fields {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1.5px solid rgba(26,26,26,.18);
      padding: 10px 4px;
    }
    .input-row:last-child { border-bottom: none; }

    .input-row span { font-size: 16px; opacity: .7; flex-shrink: 0; }

    .input-row input {
      flex: 1;
      border: none;
      outline: none;
      background: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: #1a1a1a;
    }
    .input-row input::placeholder { color: rgba(26,26,26,.45); }

    .forgot {
      align-self: flex-end;
      font-size: 12px;
      color: #555;
      text-decoration: none;
      margin-top: -6px;
    }
    .forgot:hover { text-decoration: underline; }

    .btn-entrar {
      width: 100%;
      padding: 14px;
      border-radius: 28px;
      border: none;
      background: rgba(255,255,255,.82);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .06em;
      color: #1a1a1a;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      transition: background .2s, transform .15s;
    }
    .btn-entrar:active { transform: scale(.97); }

    .btn-cadastrar {
      width: 100%;
      padding: 14px;
      border-radius: 28px;
      border: 1.5px solid rgba(26,26,26,.25);
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .06em;
      color: #1a1a1a;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }
    .btn-cadastrar:active { transform: scale(.97); background: rgba(255,255,255,.3); }

    .divider {
      font-size: 12px;
      color: #666;
      position: relative;
      width: 100%;
      text-align: center;
    }
    .divider::before, .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 30%;
      height: 1px;
      background: rgba(26,26,26,.18);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .social {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
    }

    .social-btn {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,.82);
      border: 1.5px solid rgba(255,255,255,.9);
      box-shadow: 0 2px 8px rgba(0,0,0,.10);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      padding: 0;
    }
    .social-btn:hover { transform: scale(1.08); box-shadow: 0 4px 14px rgba(0,0,0,.15); }
    .social-btn:active { transform: scale(.95); }
    .social-btn svg { width: 22px; height: 22px; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a1a;
      color: #fff;
      padding: 10px 22px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 999;
      transition: transform .3s cubic-bezier(.22,1,.36,1);
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="login-wrap">
    <h1 class="titulo">CADASTRE-SE</h1>

    <div class="card">
      <div class="avatar-placeholder">👤</div>

      <div class="fields">
        <div class="input-row">
          <span>👤</span>
          <input type="email" id="email" placeholder="Email" autocomplete="email">
        </div>
        <div class="input-row">
          <span>🔒</span>
          <input type="password" id="senha" placeholder="Senha" autocomplete="current-password">
        </div>
      </div>

      <a href="#" class="forgot" onclick="esqueceuSenha(event)">Esqueceu a senha?</a>

      <button class="btn-entrar" onclick="entrar()">ENTRAR</button>
      <button class="btn-cadastrar" onclick="cadastrar()">CADASTRAR</button>

      <p class="divider">Entrar com</p>

      <div class="social">
        <button class="social-btn" onclick="loginGoogle()" title="Google">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
        </button>

        <button class="social-btn" onclick="loginFacebook()" title="Facebook">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.235 2.686.235v2.97h-1.513c-1.491 0-1.956.93-1.956 1.886v2.269h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z" fill="#1877F2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script>
    const sb = supabase.createClient(
      "https://mgktoegtmuzrwxsbqaii.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1na3RvZWd0bXV6cnd4c2JxYWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNTA0NDcsImV4cCI6MjA5MDcyNjQ0N30.vSkBfTvgyzRGxa8xQ2CwfNvIZjsAMOuTTvs7Ldyg9AU"
    );

    async function entrar() {
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();
      if (!email || !senha) { toast("Preencha email e senha."); return; }

      const { error } = await sb.auth.signInWithPassword({ email, password: senha });
      if (error) {
        if (error.message.includes("Email not confirmed")) {
          toast("Confirme seu e-mail antes de entrar.");
        } else if (error.message.includes("Invalid login credentials")) {
          toast("E-mail ou senha incorretos.");
        } else {
          toast("Erro: " + error.message);
        }
        return;
      }
      window.location.replace("index.html");
    }

    async function cadastrar() {
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();
      if (!email || !senha) { toast("Preencha email e senha."); return; }
      if (senha.length < 6) { toast("A senha deve ter pelo menos 6 caracteres."); return; }

      const { error } = await sb.auth.signUp({ email, password: senha });
      if (error) {
        if (error.message.includes("User already registered")) {
          toast("E-mail já cadastrado. Tente fazer login.");
        } else {
          toast("Erro: " + error.message);
        }
        return;
      }
      toast("Conta criada! Verifique seu e-mail para confirmar. ✓");
    }

    async function loginGoogle() {
      const { error } = await sb.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.origin + "/index.html" }
      });
      if (error) toast("Erro ao entrar com Google: " + error.message);
    }

    async function loginFacebook() {
      const { error } = await sb.auth.signInWithOAuth({
        provider: "facebook",
        options: { redirectTo: window.location.origin + "/index.html" }
      });
      if (error) toast("Erro ao entrar com Facebook: " + error.message);
    }

    async function esqueceuSenha(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      if (!email) { toast("Digite seu e-mail primeiro."); return; }
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/index.html"
      });
      if (error) { toast("Erro: " + error.message); return; }
      toast("E-mail de recuperação enviado! ✓");
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 3000);
    }

    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN') window.location.replace("index.html");
    });
  </script>
</body>
</html>
