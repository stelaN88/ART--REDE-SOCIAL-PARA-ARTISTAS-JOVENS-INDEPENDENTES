<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ART  Novos Seguidores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f4f1;
      --surface: #ffffff;
      --border: #e8e6e0;
      --text: #1a1a1a;
      --text-muted: #888;
      --nav-height: 64px;
    }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: var(--nav-height);
      max-width: 480px;
      margin: 0 auto;
    }
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
      padding: 0 16px; height: 52px;
    }
    .btn-icon {
      background: none; border: none; cursor: pointer;
      font-size: 20px; width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text);
    }
    .header-title { font-size: 15px; font-weight: 700; }
    .lista { display: flex; flex-direction: column; }
    .seguidor-item {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      text-decoration: none; color: inherit;
      transition: background .15s;
    }
    .seguidor-item:active { background: var(--bg); }
    .seguidor-avatar {
      width: 48px; height: 48px; border-radius: 50%;
      object-fit: cover; background: #e0ddd6; flex-shrink: 0;
    }
    .seguidor-info { flex: 1; min-width: 0; }
    .seguidor-name { font-size: 14px; font-weight: 700; }
    .seguidor-cat { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
    .seguidor-tempo { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
    .empty-state {
      text-align: center; padding: 64px 20px;
      color: var(--text-muted); font-size: 14px;
    }
    .empty-icon { font-size: 40px; margin-bottom: 10px; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center;
      height: var(--nav-height); padding-bottom: env(safe-area-inset-bottom, 0px);
      z-index: 100;
    }
    .nav-item {
      flex: 1; display: flex; align-items: center; justify-content: center;
      height: 100%; text-decoration: none; font-size: 22px;
      cursor: pointer; color: var(--text-muted);
      transition: color .2s, transform .15s; background: none; border: none;
    }
    .nav-item.active { color: var(--text); }
    .nav-item:active { transform: scale(.88); }
    .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5px; width: 18px; height: 18px; }
    .nav-grid span { background: currentColor; border-radius: 2px; display: block; }
  </style>
</head>
<body>
  <header class="header">
    <button class="btn-icon" onclick="history.back()">&#8592;</button>
    <span class="header-title">Novos seguidores</span>
  </header>

  <div class="lista" id="lista">
    <div class="empty-state">
      <div class="empty-icon">👥</div>
      <p>Carregando...</p>
    </div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item" href="index.html">🏠</a>
    <a class="nav-item" href="search.html">🔍</a>
    <a class="nav-item" href="index.html">
      <div class="nav-grid"><span></span><span></span><span></span><span></span></div>
    </a>
    <a class="nav-item active" href="notificacoes.html">🤍</a>
    <a class="nav-item" href="perfil.html">👤</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script>
    const sb = supabase.createClient(
      "https://mgktoegtmuzrwxsbqaii.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1na3RvZWd0bXV6cnd4c2JxYWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNTA0NDcsImV4cCI6MjA5MDcyNjQ0N30.vSkBfTvgyzRGxa8xQ2CwfNvIZjsAMOuTTvs7Ldyg9AU"
    );

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session?.user) { window.location.replace("login.html"); return; }
      const usuario = session.user;
      await carregarSeguidores(usuario.id);
    }

    async function carregarSeguidores(userId) {
      const el = document.getElementById('lista');
      const seteAtras = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();

      const { data: follows, error } = await sb
        .from('follows')
        .select('seguidor_id, criado_em')
        .eq('seguido_id', userId)
        .gte('criado_em', seteAtras)
        .order('criado_em', { ascending: false });

      if (error || !follows || follows.length === 0) {
        el.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">👥</div>
            <p>Nenhum novo seguidor nos últimos 7 dias.</p>
          </div>`;
        return;
      }

      el.innerHTML = '';
      for (const f of follows) {
        const { data: perfil } = await sb
          .from('perfis')
          .select('username, avatar_url, categoria')
          .eq('user_id', f.seguidor_id)
          .single();

        const username = perfil?.username || 'usuário';
        const inicial = username[0].toUpperCase();
        const avatar = perfil?.avatar_url ||
          `https://ui-avatars.com/api/?name=${inicial}&background=e8e6e0&color=1a1a1a`;

        const a = document.createElement('a');
        a.className = 'seguidor-item';
        a.href = `perfil.html?id=${encodeURIComponent(f.seguidor_id)}`;
        a.innerHTML = `
          <img class="seguidor-avatar" src="${avatar}"
               onerror="this.src='https://ui-avatars.com/api/?name=${inicial}&background=e8e6e0&color=1a1a1a'">
          <div class="seguidor-info">
            <div class="seguidor-name">${escapeHtml(username)}</div>
            ${perfil?.categoria ? `<div class="seguidor-cat">${escapeHtml(perfil.categoria)}</div>` : ''}
          </div>
          <span class="seguidor-tempo">${tempoRelativo(f.criado_em)}</span>`;
        el.appendChild(a);
      }
    }

    function tempoRelativo(iso) {
      const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
      if (diff < 60) return 'agora';
      if (diff < 3600) return `${Math.floor(diff/60)}min`;
      if (diff < 86400) return `${Math.floor(diff/3600)}h`;
      return `${Math.floor(diff/86400)}d`;
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    init();
  </script>
</body>
</html>
